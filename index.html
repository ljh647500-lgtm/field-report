<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Report Pro</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="module" id="firebase-init">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, onSnapshot, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCBXiPZ18liiJBIi3cQ4ChCd-X202CXqnk",
    authDomain: "field-report-942b7.firebaseapp.com",
    projectId: "field-report-942b7",
    storageBucket: "field-report-942b7.firebasestorage.app",
    messagingSenderId: "18583674874",
    appId: "1:18583674874:web:300238b241d780acc58e43"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const storage = getStorage(app);

  window._fb = {
    db, storage,
    collection, addDoc, getDocs, doc, updateDoc, deleteDoc, onSnapshot, orderBy, query,
    ref, uploadBytes, getDownloadURL, deleteObject
  };
  window.dispatchEvent(new Event("firebase-ready"));
</script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing: antialiased; }
body {
  background:#0a0a0a; color:#e0e0e0; min-height:100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
input, textarea, button { font-family:inherit; transition: all 0.2s; }
input:focus, textarea:focus { outline: none; border-color: #e8ff47 !important; box-shadow: 0 0 0 2px rgba(232, 255, 71, 0.1); }
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background:#2a2a2a; border-radius:10px; }
::-webkit-scrollbar-thumb:hover { background:#3a3a3a; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn 0.4s ease-out forwards; }
.project-item:hover .delete-btn { opacity: 1 !important; }
.media-container:hover .media-del-btn { opacity: 1 !important; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-type="module">
const { useState, useRef, useCallback, useEffect, useMemo } = React;

const C = {
  bg: "#0a0a0a", side: "#111111", card: "#181818", input: "#222222", border: "#282828",
  accent: "#e8ff47", text: "#ffffff", muted: "#888888", danger: "#ff5252"
};

const FIELDS = [
  { key:"place",   label:"Location", icon:"📍", ph:"작업 / 방문 장소" },
  { key:"vehicle", label:"Vehicle", icon:"🚗", ph:"차량 모델 및 번호" },
  { key:"product", label:"Product", icon:"📦", ph:"설치 / 점검 제품" },
  { key:"content", label:"Description", icon:"📝", ph:"상세 작업 내용...", tall:true },
];

function fmtDate(iso) {
  if(!iso) return "날짜 미입력";
  const [y,m,d]=iso.split("-"); return `${y}.${m}.${d}`;
}

// ── 컴포넌트: 업로드 ──
function UploadButton({ onFiles, uploading }) {
  const ref = useRef(null);
  return (
    <>
      <input ref={ref} type="file" accept="image/*,video/*" multiple style={{display:"none"}}
        onChange={e=>{ const f=Array.from(e.target.files||[]); if(f.length) onFiles(f); e.target.value=""; }}/>
      <button onClick={()=>ref.current.click()} disabled={uploading}
        style={{width:100, height:100, borderRadius:12, border:`1px dashed ${C.border}`, background:C.input, color:uploading?C.muted:C.accent, cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:8}}>
        <span style={{fontSize:24}}>{uploading ? "⏳" : "+"}</span>
        <span style={{fontSize:10, fontWeight:600}}>FILE</span>
      </button>
    </>
  );
}

// ── 컴포넌트: 라이트박스 ──
function Lightbox({url, onClose}) {
  return (
    <div onClick={onClose} style={{position:"fixed", inset:0, background:"rgba(0,0,0,0.95)", zIndex:1000, display:"flex", alignItems:"center", justifyContent:"center", backdropFilter:"blur(10px)"}}>
      <img src={url} alt="" style={{maxWidth:"90%", maxHeight:"90%", borderRadius:12, boxShadow:"0 20px 40px rgba(0,0,0,0.5)"}}/>
    </div>
  );
}

// ── 컴포넌트: 보고서 뷰 ──
function ReportView({meta, days, onClose}) {
  return (
    <div className="fade-in" style={{position:"fixed", inset:0, background:"#ffffff", zIndex:2000, overflowY:"auto", padding:"60px 20px", color:"#111"}}>
      <div style={{maxWidth:800, margin:"0 auto"}}>
        <button onClick={onClose} style={{position:"fixed", top:20, right:20, background:"#111", color:"#fff", border:"none", borderRadius:30, width:40, height:40, cursor:"pointer"}}>✕</button>
        <div style={{borderBottom:"3px solid #111", paddingBottom:20, marginBottom:40}}>
          <h1 style={{fontSize:32, fontWeight:800, letterSpacing:"-0.02em"}}>FIELD REPORT</h1>
          <p style={{marginTop:10, color:"#666", fontSize:14}}>
            <strong>{meta.dest}</strong> · {meta.client} · {meta.period} · 작성: {meta.reporter}
          </p>
        </div>
        {days.map((d, i) => (
          <div key={d.id} style={{marginBottom:50, breakInside:"avoid"}}>
            <div style={{background:"#f0f0f0", padding:"10px 15px", borderRadius:4, fontWeight:700, marginBottom:20}}>DAY {i+1} — {fmtDate(d.date)}</div>
            {FIELDS.map(f => d[f.key] && (
              <div key={f.key} style={{marginBottom:15}}>
                <div style={{fontSize:11, fontWeight:700, color:"#999", textTransform:"uppercase", marginBottom:5}}>{f.label}</div>
                <div style={{fontSize:15, lineHeight:1.6, whiteSpace:"pre-wrap"}}>{d[f.key]}</div>
              </div>
            ))}
            {d.mediaFiles?.length > 0 && (
               <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(180px, 1fr))", gap:10, marginTop:20}}>
                 {d.mediaFiles.map((m, j) => (
                    m.type?.startsWith("video") 
                    ? <video key={j} src={m.url} controls style={{width:"100%", borderRadius:8}}/>
                    : <img key={j} src={m.url} style={{width:"100%", height:120, objectFit:"cover", borderRadius:8}}/>
                 ))}
               </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

// ── 메인 앱 ──
function App() {
  const [fbReady, setFbReady] = useState(!!window._fb);
  const [reportList, setReportList] = useState([]);
  const [activeMetaId, setActiveMetaId] = useState(null);
  const [meta, setMeta] = useState({dest:"", client:"", period:"", reporter:""});
  const [days, setDays] = useState([]);
  const [uploading, setUploading] = useState({});
  const [lightbox, setLightbox] = useState(null);
  const [showReport, setShowReport] = useState(false);

  const sortedDays = useMemo(() => {
    return [...days].sort((a, b) => (a.date || "9999-99-99").localeCompare(b.date || "9999-99-99"));
  }, [days]);

  useEffect(() => {
    if(window._fb) { setFbReady(true); return; }
    const h = () => setFbReady(true);
    window.addEventListener("firebase-ready", h);
    return () => window.removeEventListener("firebase-ready", h);
  }, []);

  useEffect(() => {
    if(!fbReady) return;
    const { db, collection, query, orderBy, onSnapshot } = window._fb;
    const unsub = onSnapshot(query(collection(db, "meta"), orderBy("createdAt", "desc")), snap => {
      const list = snap.docs.map(d => ({id: d.id, ...d.data()}));
      setReportList(list);
      if(!activeMetaId && list.length > 0) setActiveMetaId(list[0].id);
    });
    return () => unsub();
  }, [fbReady]);

  useEffect(() => {
    if(!fbReady || !activeMetaId) return;
    const { db, collection, query, orderBy, onSnapshot, doc } = window._fb;
    const unsubMeta = onSnapshot(doc(db, "meta", activeMetaId), (doc) => {
      if(doc.exists()) setMeta({id: doc.id, ...doc.data()});
    });
    const unsubDays = onSnapshot(query(collection(db,"days"), orderBy("createdAt","asc")), snap => {
      setDays(snap.docs.map(d => ({id: d.id, ...d.data()})));
    });
    return () => { unsubMeta(); unsubDays(); };
  }, [fbReady, activeMetaId]);

  const createNewReport = async () => {
    const { db, collection, addDoc } = window._fb;
    const newMeta = { dest: "신규 출장지", client: "신규 고객사", period: "2026.00.00", reporter: "이름", createdAt: Date.now() };
    const docRef = await addDoc(collection(db, "meta"), newMeta);
    setActiveMetaId(docRef.id);
  };

  const deleteProject = async (e, id) => {
    e.stopPropagation();
    if(!confirm("이 프로젝트 전체를 삭제하시겠습니까?")) return;
    const { db, doc, deleteDoc } = window._fb;
    await deleteDoc(doc(db, "meta", id));
    if(activeMetaId === id) setActiveMetaId(reportList.find(r => r.id !== id)?.id || null);
  };

  const updateMeta = async (k, v) => {
    const newMeta = {...meta, [k]: v};
    setMeta(newMeta);
    const { db, doc, updateDoc } = window._fb;
    clearTimeout(window._mTimer);
    window._mTimer = setTimeout(() => updateDoc(doc(db, "meta", activeMetaId), {[k]: v}), 800);
  };

  const addDay = async () => {
    const { db, collection, addDoc } = window._fb;
    await addDoc(collection(db, "days"), {
      date: new Date().toISOString().slice(0,10), 
      place:"", vehicle:"", product:"", content:"", 
      mediaFiles:[], createdAt: Date.now()
    });
  };

  const updateDay = (id, field, val) => {
    setDays(p=>p.map(d=>d.id===id?{...d,[field]:val}:d));
    const { db, doc, updateDoc } = window._fb;
    clearTimeout(window["_t"+id+field]);
    window["_t"+id+field] = setTimeout(() => updateDoc(doc(db,"days",id), {[field]:val}), 600);
  };

  const addMedia = async (dayId, files) => {
    const { storage, db, doc, updateDoc, ref, uploadBytes, getDownloadURL } = window._fb;
    setUploading(p=>({...p, [dayId]:true}));
    try {
      const day = days.find(d=>d.id===dayId);
      const newFiles = [];
      for(const file of files){
        const path = `days/${dayId}/${Date.now()}_${file.name}`;
        const sRef = ref(storage, path);
        await uploadBytes(sRef, file);
        const url = await getDownloadURL(sRef);
        newFiles.push({ url, type:file.type, path });
      }
      await updateDoc(doc(db,"days",dayId), { mediaFiles: [...(day.mediaFiles||[]), ...newFiles] });
    } finally { setUploading(p=>({...p, [dayId]:false})); }
  };

  // ── 미디어 개별 삭제 함수 ──
  const deleteMedia = async (dayId, fileIndex) => {
    if(!confirm("이 사진/영상을 삭제하시겠습니까?")) return;
    const { db, doc, updateDoc, storage, ref, deleteObject } = window._fb;
    const day = days.find(d => d.id === dayId);
    const targetFile = day.mediaFiles[fileIndex];

    try {
      // 1. Storage에서 실제 파일 삭제
      if (targetFile.path) {
        const sRef = ref(storage, targetFile.path);
        await deleteObject(sRef);
      }
      // 2. Firestore 데이터 업데이트
      const updatedMedia = day.mediaFiles.filter((_, i) => i !== fileIndex);
      await updateDoc(doc(db, "days", dayId), { mediaFiles: updatedMedia });
    } catch (err) {
      console.error("삭제 실패:", err);
      alert("삭제 중 오류가 발생했습니다.");
    }
  };

  if(!fbReady) return <div style={{display:"flex", height:"100vh", alignItems:"center", justifyContent:"center", color:C.muted}}>Connecting...</div>;

  return (
    <div style={{display:"flex", minHeight:"100vh", background:C.bg}}>
      
      {/* 사이드바 */}
      <div style={{width:280, background:C.side, borderRight:`1px solid ${C.border}`, display:"flex", flexDirection:"column", flexShrink:0}}>
        <div style={{padding:24, borderBottom:`1px solid ${C.border}`}}>
          <div style={{fontSize:11, fontWeight:800, letterSpacing:"0.2em", color:C.accent, marginBottom:20}}>PROJECTS</div>
          <button onClick={createNewReport} style={{width:"100%", padding:"12px", background:C.accent, border:"none", borderRadius:8, fontWeight:700, cursor:"pointer", fontSize:12, color:"#000"}}>+ New Report</button>
        </div>
        <div style={{flex:1, overflowY:"auto", padding:12}}>
          {reportList.map(r => (
            <div key={r.id} onClick={() => setActiveMetaId(r.id)} className="project-item"
              style={{padding:"16px", borderRadius:10, cursor:"pointer", marginBottom:8, transition:"0.2s", background:activeMetaId===r.id?C.card:"transparent", border:`1px solid ${activeMetaId===r.id?C.border:"transparent"}`, position:"relative"}}>
              <div style={{fontSize:13, fontWeight:600, color:activeMetaId===r.id?C.accent:C.text, marginBottom:4, paddingRight:20, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{r.dest || "Untitled"}</div>
              <div style={{fontSize:11, color:C.muted, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{r.client}</div>
              <button className="delete-btn" onClick={(e)=>deleteProject(e, r.id)} 
                style={{position:"absolute", top:"50%", transform:"translateY(-50%)", right:12, background:"rgba(255,82,82,0.1)", border:"none", color:C.danger, borderRadius:4, width:24, height:24, cursor:"pointer", opacity:0, transition:"0.2s", display:"flex", alignItems:"center", justifyContent:"center", fontSize:12}}>✕</button>
            </div>
          ))}
        </div>
      </div>

      {/* 메인 컨텐츠 */}
      <div style={{flex:1, overflowY:"auto", padding:"40px 20px"}}>
        {!activeMetaId ? (
          <div style={{display:"flex", height:"100%", alignItems:"center", justifyContent:"center", color:C.muted, fontSize:14}}>리포트를 선택하거나 새로 만드세요.</div>
        ) : (
          <div style={{maxWidth:800, margin:"0 auto"}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-end", marginBottom:40}}>
              <div>
                <div style={{fontSize:12, fontWeight:700, color:C.muted, marginBottom:8, letterSpacing:"0.1em"}}>CURRENT REPORT</div>
                <h2 style={{fontSize:28, fontWeight:800}}>{meta.dest || "Untitled"}</h2>
              </div>
              <button onClick={()=>setShowReport(true)} style={{padding:"10px 20px", background:"transparent", border:`1px solid ${C.accent}`, color:C.accent, borderRadius:30, fontSize:12, fontWeight:600, cursor:"pointer"}}>View Full Report</button>
            </div>

            <div className="fade-in" style={{background:C.card, borderRadius:16, padding:24, border:`1px solid ${C.border}`, display:"grid", gridTemplateColumns:"repeat(2, 1fr)", gap:20, marginBottom:30}}>
              {[
                {k:"dest", l:"출장지", p:"Location"}, {k:"client", l:"고객사", p:"Client"},
                {k:"period", l:"기간", p:"2026.01.01 - 01.05"}, {k:"reporter", l:"작성자", p:"Name"},
              ].map(f => (
                <div key={f.k}>
                  <label style={{fontSize:10, fontWeight:700, color:C.muted, display:"block", marginBottom:8, textTransform:"uppercase"}}>{f.l}</label>
                  <input style={{width:"100%", background:C.input, border:`1px solid ${C.border}`, borderRadius:8, padding:"10px 14px", color:C.text, fontSize:14}}
                    value={meta[f.k]||""} placeholder={f.p} onChange={e=>updateMeta(f.k, e.target.value)}/>
                </div>
              ))}
            </div>

            <div style={{marginBottom:20, display:"flex", alignItems:"center", justifyContent:"space-between"}}>
              <div style={{fontSize:14, fontWeight:700}}>Daily Logs ({sortedDays.length})</div>
              <button onClick={addDay} style={{background:C.input, border:`1px solid ${C.border}`, color:C.text, padding:"6px 14px", borderRadius:6, fontSize:12, cursor:"pointer"}}>+ Add Day</button>
            </div>

            {sortedDays.map((d, idx) => (
              <div className="fade-in" key={d.id} style={{background:C.card, borderRadius:16, border:`1px solid ${C.border}`, marginBottom:20, overflow:"hidden"}}>
                <div style={{padding:"15px 24px", background:"rgba(255,255,255,0.03)", display:"flex", alignItems:"center", justifyContent:"space-between", borderBottom:`1px solid ${C.border}`}}>
                  <div style={{display:"flex", alignItems:"center", gap:15}}>
                    <span style={{fontSize:11, fontWeight:900, color:C.accent}}>DAY {idx+1}</span>
                    <input type="date" value={d.date||""} onChange={e=>updateDay(d.id, "date", e.target.value)}
                      style={{background:"transparent", border:"none", color:C.text, fontSize:13, colorScheme:"dark"}}/>
                  </div>
                  <button onClick={async() => { if(confirm("이 날짜 기록을 삭제할까요?")) await window._fb.deleteDoc(window._fb.doc(window._fb.db,"days",d.id)); }}
                    style={{background:"transparent", border:"none", color:C.muted, cursor:"pointer", fontSize:12}}>Delete Day</button>
                </div>
                <div style={{padding:24}}>
                  <div style={{display:"grid", gridTemplateColumns:"repeat(3, 1fr)", gap:15, marginBottom:20}}>
                    {FIELDS.slice(0,3).map(f => (
                      <div key={f.key}>
                        <div style={{fontSize:10, color:C.muted, marginBottom:6}}>{f.icon} {f.label}</div>
                        <input style={{width:"100%", background:C.input, border:`1px solid ${C.border}`, borderRadius:8, padding:"8px 12px", color:C.text, fontSize:13}}
                          placeholder={f.ph} value={d[f.key]||""} onChange={e=>updateDay(d.id, f.key, e.target.value)}/>
                      </div>
                    ))}
                  </div>
                  <div style={{marginBottom:20}}>
                    <div style={{fontSize:10, color:C.muted, marginBottom:6}}>📝 Description</div>
                    <textarea style={{width:"100%", background:C.input, border:`1px solid ${C.border}`, borderRadius:8, padding:"12px", color:C.text, fontSize:13, minHeight:100}}
                      placeholder="내용을 입력하세요..." value={d.content||""} onChange={e=>updateDay(d.id, "content", e.target.value)}/>
                  </div>
                  <div style={{display:"flex", flexWrap:"wrap", gap:10}}>
                    {d.mediaFiles?.map((m, i) => (
                      <div key={i} className="media-container" style={{position:"relative", width:100, height:100, borderRadius:12, overflow:"hidden", border:`1px solid ${C.border}`}}>
                        {m.type?.startsWith("video") 
                          ? <video src={m.url} style={{width:"100%", height:"100%", objectFit:"cover"}}/>
                          : <img src={m.url} onClick={()=>setLightbox(m.url)} style={{width:"100%", height:"100%", objectFit:"cover", cursor:"pointer"}}/>
                        }
                        {/* 미디어 개별 삭제 버튼 */}
                        <button className="media-del-btn" onClick={()=>deleteMedia(d.id, i)}
                          style={{position:"absolute", top:5, right:5, background:"rgba(0,0,0,0.6)", border:"none", color:"#fff", width:20, height:20, borderRadius:10, cursor:"pointer", fontSize:10, opacity:0, transition:"0.2s", display:"flex", alignItems:"center", justifyContent:"center"}}>✕</button>
                      </div>
                    ))}
                    <UploadButton uploading={uploading[d.id]} onFiles={f => addMedia(d.id, f)}/>
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {lightbox && <Lightbox url={lightbox} onClose={()=>setLightbox(null)}/>}
      {showReport && <ReportView meta={meta} days={sortedDays} onClose={()=>setShowReport(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
