<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Field Report Pro</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="module" id="firebase-init">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, onSnapshot, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCBXiPZ18liiJBIi3cQ4ChCd-X202CXqnk",
    authDomain: "field-report-942b7.firebaseapp.com",
    projectId: "field-report-942b7",
    storageBucket: "field-report-942b7.firebasestorage.app",
    messagingSenderId: "18583674874",
    appId: "1:18583674874:web:300238b241d780acc58e43"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const storage = getStorage(app);

  window._fb = {
    db, storage,
    collection, addDoc, getDocs, doc, updateDoc, deleteDoc, onSnapshot, orderBy, query,
    ref, uploadBytes, getDownloadURL, deleteObject
  };
  window.dispatchEvent(new Event("firebase-ready"));
</script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing: antialiased; }
body {
  background:#0a0a0a; color:#e0e0e0; min-height:100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
input, textarea, button { font-family:inherit; transition: all 0.2s; -webkit-appearance: none; }
input:focus, textarea:focus { outline: none; border-color: #e8ff47 !important; }

/* 레이아웃 핵심: 반응형 디자인 */
.app-container { display: flex; min-height: 100vh; }
.sidebar { width: 280px; flex-shrink: 0; background: #111; border-right: 1px solid #282828; display: flex; flexDirection: column; }
.main-content { flex: 1; padding: 40px 20px; overflow-y: auto; }

@media (max-width: 768px) {
  .app-container { flex-direction: column; }
  .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #282828; height: auto; max-height: 200px; }
  .main-content { padding: 20px 15px; }
  .project-list { display: flex !important; overflow-x: auto; padding: 10px; gap: 10px; }
  .project-item { min-width: 160px; margin-bottom: 0 !important; }
  .meta-grid { grid-template-columns: 1fr !important; }
  .daily-grid { grid-template-columns: 1fr !important; }
}

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn 0.4s ease-out forwards; }
.media-container:hover .media-del-btn { opacity: 1 !important; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-type="module">
const { useState, useRef, useCallback, useEffect, useMemo } = React;

const C = {
  bg: "#0a0a0a", side: "#111111", card: "#181818", input: "#222222", border: "#282828",
  accent: "#e8ff47", text: "#ffffff", muted: "#888888", danger: "#ff5252"
};

const FIELDS = [
  { key:"place",   label:"Location", icon:"📍", ph:"장소" },
  { key:"vehicle", label:"Vehicle", icon:"🚗", ph:"차량" },
  { key:"product", label:"Product", icon:"📦", ph:"제품" },
  { key:"content", label:"Description", icon:"📝", ph:"작업 내용...", tall:true },
];

function fmtDate(iso) {
  if(!iso) return "날짜 미입력";
  const [y,m,d]=iso.split("-"); return `${y}.${m}.${d}`;
}

// ── 업로드 ──
function UploadButton({ onFiles, uploading }) {
  const ref = useRef(null);
  return (
    <>
      <input ref={ref} type="file" accept="image/*,video/*" multiple style={{display:"none"}}
        onChange={e=>{ const f=Array.from(e.target.files||[]); if(f.length) onFiles(f); e.target.value=""; }}/>
      <button onClick={()=>ref.current.click()} disabled={uploading}
        style={{width:80, height:80, borderRadius:12, border:`1px dashed ${C.border}`, background:C.input, color:uploading?C.muted:C.accent, cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:4}}>
        <span style={{fontSize:20}}>{uploading ? "⏳" : "+"}</span>
        <span style={{fontSize:9, fontWeight:600}}>FILE</span>
      </button>
    </>
  );
}

// ── 라이트박스 ──
function Lightbox({url, onClose}) {
  return (
    <div onClick={onClose} style={{position:"fixed", inset:0, background:"rgba(0,0,0,0.95)", zIndex:3000, display:"flex", alignItems:"center", justifyContent:"center", backdropFilter:"blur(10px)"}}>
      <img src={url} alt="" style={{maxWidth:"95%", maxHeight:"90%", borderRadius:8}}/>
    </div>
  );
}

// ── 보고서 뷰 ──
function ReportView({meta, days, onClose}) {
  return (
    <div className="fade-in" style={{position:"fixed", inset:0, background:"#ffffff", zIndex:4000, overflowY:"auto", padding:"40px 15px", color:"#111"}}>
      <div style={{maxWidth:800, margin:"0 auto"}}>
        <button onClick={onClose} style={{position:"fixed", top:15, right:15, background:"#111", color:"#fff", border:"none", borderRadius:30, width:36, height:36, cursor:"pointer", zIndex:10}}>✕</button>
        <div style={{borderBottom:"2px solid #111", paddingBottom:15, marginBottom:30}}>
          <h1 style={{fontSize:24, fontWeight:800}}>FIELD REPORT</h1>
          <p style={{marginTop:8, color:"#666", fontSize:13}}>
            <strong>{meta.dest}</strong> · {meta.client} · {meta.period}
          </p>
        </div>
        {days.map((d, i) => (
          <div key={d.id} style={{marginBottom:40, breakInside:"avoid"}}>
            <div style={{background:"#f0f0f0", padding:"8px 12px", borderRadius:4, fontWeight:700, marginBottom:15, fontSize:14}}>DAY {i+1} — {fmtDate(d.date)}</div>
            {FIELDS.map(f => d[f.key] && (
              <div key={f.key} style={{marginBottom:12}}>
                <div style={{fontSize:10, fontWeight:700, color:"#999", textTransform:"uppercase", marginBottom:3}}>{f.label}</div>
                <div style={{fontSize:14, lineHeight:1.5, whiteSpace:"pre-wrap"}}>{d[f.key]}</div>
              </div>
            ))}
            {d.mediaFiles?.length > 0 && (
               <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(140px, 1fr))", gap:8, marginTop:15}}>
                 {d.mediaFiles.map((m, j) => (
                    m.type?.startsWith("video") 
                    ? <video key={j} src={m.url} controls style={{width:"100%", borderRadius:6}}/>
                    : <img key={j} src={m.url} style={{width:"100%", height:100, objectFit:"cover", borderRadius:6}}/>
                 ))}
               </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

// ── 메인 앱 ──
function App() {
  const [fbReady, setFbReady] = useState(!!window._fb);
  const [reportList, setReportList] = useState([]);
  const [activeMetaId, setActiveMetaId] = useState(null);
  const [meta, setMeta] = useState({dest:"", client:"", period:"", reporter:""});
  const [days, setDays] = useState([]);
  const [uploading, setUploading] = useState({});
  const [lightbox, setLightbox] = useState(null);
  const [showReport, setShowReport] = useState(false);

  const sortedDays = useMemo(() => {
    return [...days].sort((a, b) => (a.date || "9999-99-99").localeCompare(b.date || "9999-99-99"));
  }, [days]);

  useEffect(() => {
    if(window._fb) { setFbReady(true); return; }
    const h = () => setFbReady(true);
    window.addEventListener("firebase-ready", h);
    return () => window.removeEventListener("firebase-ready", h);
  }, []);

  useEffect(() => {
    if(!fbReady) return;
    const { db, collection, query, orderBy, onSnapshot } = window._fb;
    const unsub = onSnapshot(query(collection(db, "meta"), orderBy("createdAt", "desc")), snap => {
      const list = snap.docs.map(d => ({id: d.id, ...d.data()}));
      setReportList(list);
      if(!activeMetaId && list.length > 0) setActiveMetaId(list[0].id);
    });
    return () => unsub();
  }, [fbReady]);

  useEffect(() => {
    if(!fbReady || !activeMetaId) return;
    const { db, collection, query, orderBy, onSnapshot, doc } = window._fb;
    const unsubMeta = onSnapshot(doc(db, "meta", activeMetaId), (doc) => {
      if(doc.exists()) setMeta({id: doc.id, ...doc.data()});
    });
    const unsubDays = onSnapshot(query(collection(db,"days"), orderBy("createdAt","asc")), snap => {
      setDays(snap.docs.map(d => ({id: d.id, ...d.data()})));
    });
    return () => { unsubMeta(); unsubDays(); };
  }, [fbReady, activeMetaId]);

  const createNewReport = async () => {
    const { db, collection, addDoc } = window._fb;
    const newMeta = { dest: "신규 리포트", client: "고객사", period: "2026.01.01", reporter: "이름", createdAt: Date.now() };
    const docRef = await addDoc(collection(db, "meta"), newMeta);
    setActiveMetaId(docRef.id);
  };

  const deleteProject = async (e, id) => {
    e.stopPropagation();
    if(!confirm("이 리포트를 삭제할까요?")) return;
    const { db, doc, deleteDoc } = window._fb;
    await deleteDoc(doc(db, "meta", id));
    if(activeMetaId === id) setActiveMetaId(reportList.find(r => r.id !== id)?.id || null);
  };

  const updateMeta = async (k, v) => {
    const newMeta = {...meta, [k]: v}; setMeta(newMeta);
    const { db, doc, updateDoc } = window._fb;
    clearTimeout(window._mTimer);
    window._mTimer = setTimeout(() => updateDoc(doc(db, "meta", activeMetaId), {[k]: v}), 800);
  };

  const addDay = async () => {
    const { db, collection, addDoc } = window._fb;
    await addDoc(collection(db, "days"), {
      date: new Date().toISOString().slice(0,10), 
      place:"", vehicle:"", product:"", content:"", 
      mediaFiles:[], createdAt: Date.now()
    });
  };

  const updateDay = (id, field, val) => {
    setDays(p=>p.map(d=>d.id===id?{...d,[field]:val}:d));
    const { db, doc, updateDoc } = window._fb;
    clearTimeout(window["_t"+id+field]);
    window["_t"+id+field] = setTimeout(() => updateDoc(doc(db,"days",id), {[field]:val}), 600);
  };

  const addMedia = async (dayId, files) => {
    const { storage, db, doc, updateDoc, ref, uploadBytes, getDownloadURL } = window._fb;
    setUploading(p=>({...p, [dayId]:true}));
    try {
      const day = days.find(d=>d.id===dayId);
      const newFiles = [];
      for(const file of files){
        const path = `days/${dayId}/${Date.now()}_${file.name}`;
        const sRef = ref(storage, path);
        await uploadBytes(sRef, file);
        const url = await getDownloadURL(sRef);
        newFiles.push({ url, type:file.type, path });
      }
      await updateDoc(doc(db,"days",dayId), { mediaFiles: [...(day.mediaFiles||[]), ...newFiles] });
    } finally { setUploading(p=>({...p, [dayId]:false})); }
  };

  const deleteMedia = async (dayId, fileIndex) => {
    if(!confirm("삭제하시겠습니까?")) return;
    const { db, doc, updateDoc, storage, ref, deleteObject } = window._fb;
    const day = days.find(d => d.id === dayId);
    const targetFile = day.mediaFiles[fileIndex];
    try {
      if (targetFile.path) await deleteObject(ref(storage, targetFile.path));
      const updatedMedia = day.mediaFiles.filter((_, i) => i !== fileIndex);
      await updateDoc(doc(db, "days", dayId), { mediaFiles: updatedMedia });
    } catch (err) { console.error(err); }
  };

  if(!fbReady) return <div style={{display:"flex", height:"100vh", alignItems:"center", justifyContent:"center", color:C.muted}}>Loading...</div>;

  return (
    <div className="app-container">
      {/* 사이드바 (모바일에서는 상단 스크롤 영역으로 변경됨) */}
      <div className="sidebar">
        <div style={{padding:"20px", borderBottom:`1px solid ${C.border}`, display:"flex", alignItems:"center", justifyContent:"space-between"}}>
          <div style={{fontSize:10, fontWeight:800, color:C.accent, letterSpacing:"0.1em"}}>PROJECTS</div>
          <button onClick={createNewReport} style={{padding:"6px 12px", background:C.accent, border:"none", borderRadius:6, fontSize:11, fontWeight:700, cursor:"pointer"}}>+ NEW</button>
        </div>
        <div className="project-list" style={{flex:1, overflowY:"auto", padding:"10px"}}>
          {reportList.map(r => (
            <div key={r.id} onClick={() => setActiveMetaId(r.id)} className="project-item"
              style={{padding:"12px", borderRadius:10, cursor:"pointer", marginBottom:"8px", background:activeMetaId===r.id?C.card:"transparent", border:`1px solid ${activeMetaId===r.id?C.border:"transparent"}`, position:"relative"}}>
              <div style={{fontSize:12, fontWeight:600, color:activeMetaId===r.id?C.accent:C.text, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>{r.dest || "Untitled"}</div>
              <div style={{fontSize:10, color:C.muted}}>{r.client}</div>
              <button onClick={(e)=>deleteProject(e, r.id)} style={{position:"absolute", top:10, right:8, background:"none", border:"none", color:C.danger, fontSize:12, cursor:"pointer"}}>✕</button>
            </div>
          ))}
        </div>
      </div>

      {/* 메인 컨텐츠 */}
      <div className="main-content">
        {!activeMetaId ? (
          <div style={{textAlign:"center", color:C.muted, marginTop:100}}>리포트를 선택하세요.</div>
        ) : (
          <div style={{maxWidth:800, margin:"0 auto"}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:30}}>
              <h2 style={{fontSize:20, fontWeight:800}}>{meta.dest || "Untitled"}</h2>
              <button onClick={()=>setShowReport(true)} style={{padding:"8px 16px", background:"transparent", border:`1px solid ${C.accent}`, color:C.accent, borderRadius:20, fontSize:11, fontWeight:600}}>Full View</button>
            </div>

            <div className="meta-grid fade-in" style={{background:C.card, borderRadius:16, padding:20, border:`1px solid ${C.border}`, display:"grid", gridTemplateColumns:"repeat(2, 1fr)", gap:15, marginBottom:25}}>
              {[
                {k:"dest", l:"출장지"}, {k:"client", l:"고객사"},
                {k:"period", l:"기간"}, {k:"reporter", l:"작성자"},
              ].map(f => (
                <div key={f.k}>
                  <label style={{fontSize:9, fontWeight:700, color:C.muted, display:"block", marginBottom:5}}>{f.l}</label>
                  <input style={{width:"100%", background:C.input, border:`1px solid ${C.border}`, borderRadius:8, padding:"10px", color:C.text, fontSize:13}}
                    value={meta[f.k]||""} onChange={e=>updateMeta(f.k, e.target.value)}/>
                </div>
              ))}
            </div>

            <div style={{marginBottom:15, display:"flex", alignItems:"center", justifyContent:"space-between"}}>
              <div style={{fontSize:13, fontWeight:700}}>Daily Logs</div>
              <button onClick={addDay} style={{background:C.input, border:`1px solid ${C.border}`, color:C.text, padding:"5px 12px", borderRadius:6, fontSize:11}}>+ Day</button>
            </div>

            {sortedDays.map((d, idx) => (
              <div className="fade-in" key={d.id} style={{background:C.card, borderRadius:16, border:`1px solid ${C.border}`, marginBottom:20, overflow:"hidden"}}>
                <div style={{padding:"12px 20px", background:"rgba(255,255,255,0.02)", display:"flex", alignItems:"center", justifyContent:"space-between", borderBottom:`1px solid ${C.border}`}}>
                  <div style={{display:"flex", alignItems:"center", gap:10}}>
                    <span style={{fontSize:10, fontWeight:900, color:C.accent}}>DAY {idx+1}</span>
                    <input type="date" value={d.date||""} onChange={e=>updateDay(d.id, "date", e.target.value)}
                      style={{background:"transparent", border:"none", color:C.text, fontSize:12, colorScheme:"dark"}}/>
                  </div>
                  <button onClick={async() => { if(confirm("삭제할까요?")) await window._fb.deleteDoc(window._fb.doc(window._fb.db,"days",d.id)); }}
                    style={{background:"transparent", border:"none", color:C.muted, fontSize:11}}>Delete</button>
                </div>
                <div style={{padding:20}}>
                  <div className="daily-grid" style={{display:"grid", gridTemplateColumns:"repeat(3, 1fr)", gap:10, marginBottom:15}}>
                    {FIELDS.slice(0,3).map(f => (
                      <div key={f.key}>
                        <div style={{fontSize:9, color:C.muted, marginBottom:4}}>{f.label}</div>
                        <input style={{width:"100%", background:C.input, border:`1px solid ${C.border}`, borderRadius:8, padding:"8px", color:C.text, fontSize:12}}
                          value={d[f.key]||""} onChange={e=>updateDay(d.id, f.key, e.target.value)}/>
                      </div>
                    ))}
                  </div>
                  <div style={{marginBottom:15}}>
                    <div style={{fontSize:9, color:C.muted, marginBottom:4}}>Description</div>
                    <textarea style={{width:"100%", background:C.input, border:`1px solid ${C.border}`, borderRadius:8, padding:"10px", color:C.text, fontSize:12, minHeight:80}}
                      value={d.content||""} onChange={e=>updateDay(d.id, "content", e.target.value)}/>
                  </div>
                  <div style={{display:"flex", flexWrap:"wrap", gap:8}}>
                    {d.mediaFiles?.map((m, i) => (
                      <div key={i} className="media-container" style={{position:"relative", width:80, height:80, borderRadius:10, overflow:"hidden", border:`1px solid ${C.border}`}}>
                        {m.type?.startsWith("video") 
                          ? <video src={m.url} style={{width:"100%", height:"100%", objectFit:"cover"}}/>
                          : <img src={m.url} onClick={()=>setLightbox(m.url)} style={{width:"100%", height:"100%", objectFit:"cover"}}/>
                        }
                        <button className="media-del-btn" onClick={()=>deleteMedia(d.id, i)}
                          style={{position:"absolute", top:4, right:4, background:"rgba(0,0,0,0.7)", border:"none", color:"#fff", width:18, height:18, borderRadius:9, fontSize:10}}>✕</button>
                      </div>
                    ))}
                    <UploadButton uploading={uploading[d.id]} onFiles={f => addMedia(d.id, f)}/>
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {lightbox && <Lightbox url={lightbox} onClose={()=>setLightbox(null)}/>}
      {showReport && <ReportView meta={meta} days={sortedDays} onClose={()=>setShowReport(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
