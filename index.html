<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Field Report Pro</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="module" id="firebase-init">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, onSnapshot, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCBXiPZ18liiJBIi3cQ4ChCd-X202CXqnk",
    authDomain: "field-report-942b7.firebaseapp.com",
    projectId: "field-report-942b7",
    storageBucket: "field-report-942b7.firebasestorage.app",
    messagingSenderId: "18583674874",
    appId: "1:18583674874:web:300238b241d780acc58e43"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const storage = getStorage(app);

  window._fb = {
    db, storage,
    collection, addDoc, getDocs, doc, updateDoc, deleteDoc, onSnapshot, orderBy, query,
    ref, uploadBytes, getDownloadURL, deleteObject
  };
  window.dispatchEvent(new Event("firebase-ready"));
</script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing: antialiased; }
body {
  background:#0a0a0a; color:#e0e0e0; min-height:100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
input, textarea, button { font-family:inherit; transition: all 0.2s; -webkit-appearance: none; }
input:focus, textarea:focus { outline: none; border-color: #e8ff47 !important; }

.app-container { display: flex; min-height: 100vh; }
.sidebar { width: 280px; flex-shrink: 0; background: #111; border-right: 1px solid #282828; display: flex; flex-direction: column; }
.main-content { flex: 1; padding: 40px 20px; overflow-y: auto; }

@media (max-width: 768px) {
  .app-container { flex-direction: column; }
  .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #282828; max-height: 200px; }
  .main-content { padding: 20px 15px; }
  .project-list { display: flex !important; overflow-x: auto; padding: 10px; gap: 10px; }
  .project-item { min-width: 160px; margin-bottom: 0 !important; }
}

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn 0.4s ease-out forwards; }
.media-container:hover .media-del-btn { opacity: 1 !important; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-type="module">
const { useState, useRef, useCallback, useEffect, useMemo } = React;

const C = {
  bg: "#0a0a0a", side: "#111111", card: "#181818", input: "#222222", border: "#282828",
  accent: "#e8ff47", text: "#ffffff", muted: "#888888", danger: "#ff5252"
};

const FIELDS = [
  { key:"place",   label:"Location", icon:"📍" },
  { key:"vehicle", label:"Vehicle", icon:"🚗" },
  { key:"product", label:"Product", icon:"📦" },
  { key:"content", label:"Description", icon:"📝" },
];

function fmtDate(iso) {
  if(!iso) return "날짜 미입력";
  const [y,m,d]=iso.split("-"); return `${y}.${m}.${d}`;
}

// ── 컴포넌트: 보고서 전용 뷰 ──
function PureReportView({meta, days, isFullPage}) {
  return (
    <div className="fade-in" style={{
      position: isFullPage ? "relative" : "fixed",
      inset: isFullPage ? "auto" : 0,
      background: "#ffffff", 
      zIndex: 4000, 
      overflowY: "auto", 
      padding: isFullPage ? "0" : "40px 15px", 
      color: "#111",
      minHeight: "100vh"
    }}>
      <div style={{maxWidth: 800, margin: "0 auto", paddingBottom: 60}}>
        <div style={{borderBottom: "3px solid #111", paddingBottom: 20, marginBottom: 40}}>
          <h1 style={{fontSize: 28, fontWeight: 800, letterSpacing: "-0.02em"}}>FIELD REPORT</h1>
          <p style={{marginTop: 10, color: "#666", fontSize: 14}}>
            <strong>{meta.dest}</strong> · {meta.client} · {meta.period} <br/>
            <span style={{fontSize: 12}}>작성자: {meta.reporter}</span>
          </p>
        </div>
        {days.length === 0 && <p style={{textAlign:"center", color:"#999", padding:"40px 0"}}>등록된 일정이 없습니다.</p>}
        {days.map((d, i) => (
          <div key={d.id} style={{marginBottom: 50, breakInside: "avoid"}}>
            <div style={{background: "#f4f4f4", padding: "10px 15px", borderRadius: 4, fontWeight: 700, marginBottom: 20, fontSize: 15, borderLeft: "4px solid #111"}}>
              DAY {i+1} — {fmtDate(d.date)}
            </div>
            {FIELDS.map(f => d[f.key] && (
              <div key={f.key} style={{marginBottom: 18}}>
                <div style={{fontSize: 11, fontWeight: 800, color: "#aaa", textTransform: "uppercase", marginBottom: 5}}>{f.label}</div>
                <div style={{fontSize: 15, lineHeight: 1.6, whiteSpace: "pre-wrap"}}>{d[f.key]}</div>
              </div>
            ))}
            {d.mediaFiles?.length > 0 && (
               <div style={{display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(240px, 1fr))", gap: 10, marginTop: 20}}>
                 {d.mediaFiles.map((m, j) => (
                    m.type?.startsWith("video") 
                    ? <video key={j} src={m.url} controls style={{width: "100%", borderRadius: 8}}/>
                    : <img key={j} src={m.url} style={{width: "100%", borderRadius: 8}}/>
                 ))}
               </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

// ── 업로드 버튼 ──
function UploadButton({ onFiles, uploading }) {
  const ref = useRef(null);
  return (
    <>
      <input ref={ref} type="file" accept="image/*,video/*" multiple style={{display:"none"}}
        onChange={e=>{ const f=Array.from(e.target.files||[]); if(f.length) onFiles(f); e.target.value=""; }}/>
      <button onClick={()=>ref.current.click()} disabled={uploading}
        style={{width:80, height:80, borderRadius:12, border:`1px dashed ${C.border}`, background:C.input, color:uploading?C.muted:C.accent, cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:4}}>
        <span style={{fontSize:20}}>{uploading ? "⏳" : "+"}</span>
        <span style={{fontSize:9, fontWeight:600}}>FILE</span>
      </button>
    </>
  );
}

function App() {
  const [fbReady, setFbReady] = useState(!!window._fb);
  const [reportList, setReportList] = useState([]);
  const [activeMetaId, setActiveMetaId] = useState(null);
  const [meta, setMeta] = useState({dest:"", client:"", period:"", reporter:""});
  const [days, setDays] = useState([]);
  const [uploading, setUploading] = useState({});
  const [lightbox, setLightbox] = useState(null);
  const [showReport, setShowReport] = useState(false);
  
  // URL 쿼리 확인 (?mode=view)
  const isViewMode = new URLSearchParams(window.location.search).get('mode') === 'view';

  const sortedDays = useMemo(() => {
    return [...days].sort((a, b) => (a.date || "9999-99-99").localeCompare(b.date || "9999-99-99"));
  }, [days]);

  useEffect(() => {
    if(window._fb) { setFbReady(true); return; }
    const h = () => setFbReady(true);
    window.addEventListener("firebase-ready", h);
    return () => window.removeEventListener("firebase-ready", h);
  }, []);

  useEffect(() => {
    if(!fbReady) return;
    const { db, collection, query, orderBy, onSnapshot } = window._fb;
    const unsub = onSnapshot(query(collection(db, "meta"), orderBy("createdAt", "desc")), snap => {
      const list = snap.docs.map(d => ({id: d.id, ...d.data()}));
      setReportList(list);
      
      // 뷰어 모드일 때 첫 번째 리포트 자동 선택
      if(isViewMode && list.length > 0 && !activeMetaId) {
          setActiveMetaId(list[0].id);
      } else if(!activeMetaId && list.length > 0) {
          setActiveMetaId(list[0].id);
      }
    });
    return () => unsub();
  }, [fbReady]);

  useEffect(() => {
    if(!fbReady || !activeMetaId) return;
    const { db, collection, query, orderBy, onSnapshot, doc } = window._fb;
    const unsubMeta = onSnapshot(doc(db, "meta", activeMetaId), (doc) => {
      if(doc.exists()) setMeta({id: doc.id, ...doc.data()});
    });
    const unsubDays = onSnapshot(query(collection(db,"days"), orderBy("createdAt","asc")), snap => {
      setDays(snap.docs.map(d => ({id: d.id, ...d.data()})));
    });
    return () => { unsubMeta(); unsubDays(); };
  }, [fbReady, activeMetaId]);

  const updateMeta = async (k, v) => {
    const newMeta = {...meta, [k]: v}; setMeta(newMeta);
    const { db, doc, updateDoc } = window._fb;
    clearTimeout(window._mTimer);
    window._mTimer = setTimeout(() => updateDoc(doc(db, "meta", activeMetaId), {[k]: v}), 800);
  };

  const updateDay = (id, field, val) => {
    setDays(p=>p.map(d=>d.id===id?{...d,[field]:val}:d));
    const { db, doc, updateDoc } = window._fb;
    clearTimeout(window["_t"+id+field]);
    window["_t"+id+field] = setTimeout(() => updateDoc(doc(db,"days",id), {[field]:val}), 600);
  };

  const addMedia = async (dayId, files) => {
    const { storage, db, doc, updateDoc, ref, uploadBytes, getDownloadURL } = window._fb;
    setUploading(p=>({...p, [dayId]:true}));
    try {
      const day = days.find(d=>d.id===dayId);
      const newFiles = [];
      for(const file of files){
        const path = `days/${dayId}/${Date.now()}_${file.name}`;
        const sRef = ref(storage, path);
        await uploadBytes(sRef, file);
        const url = await getDownloadURL(sRef);
        newFiles.push({ url, type:file.type, path });
      }
      await updateDoc(doc(db,"days",dayId), { mediaFiles: [...(day.mediaFiles||[]), ...newFiles] });
    } finally { setUploading(p=>({...p, [dayId]:false})); }
  };

  const deleteMedia = async (dayId, fileIndex) => {
    if(!confirm("삭제하시겠습니까?")) return;
    const { db, doc, updateDoc, storage, ref, deleteObject } = window._fb;
    const day = days.find(d => d.id === dayId);
    const targetFile = day.mediaFiles[fileIndex];
    try {
      if (targetFile.path) await deleteObject(ref(storage, targetFile.path));
      const updatedMedia = day.mediaFiles.filter((_, i) => i !== fileIndex);
      await updateDoc(doc(db, "days", dayId), { mediaFiles: updatedMedia });
    } catch (err) { console.error(err); }
  };

  if(!fbReady) return <div style={{display:"flex", height:"100vh", alignItems:"center", justifyContent:"center", color:C.muted}}>Loading...</div>;

  // ── [뷰 모드] 일 때의 화면 ──
  if (isViewMode) {
      return <div style={{background:"#fff"}}><PureReportView meta={meta} days={sortedDays} isFullPage={true} /></div>;
  }

  // ── [편집 모드] 일 때의 화면 ──
  return (
    <div className="app-container">
      <div className="sidebar">
        <div style={{padding:"20px", borderBottom:`1px solid ${C.border}`, display:"flex", alignItems:"center", justifyContent:"space-between"}}>
          <div style={{fontSize:10, fontWeight:800, color:C.accent, letterSpacing:"0.1em"}}>PROJECTS</div>
          <button onClick={async () => {
              const { db, collection, addDoc } = window._fb;
              const docRef = await addDoc(collection(db, "meta"), { dest: "신규 리포트", client: "고객사", period: "2026.01.01", reporter: "이름", createdAt: Date.now() });
              setActiveMetaId(docRef.id);
          }} style={{padding:"6px 12px", background:C.accent, border:"none", borderRadius:6, fontSize:11, fontWeight:700, cursor:"pointer"}}>+ NEW</button>
        </div>
        <div className="project-list" style={{flex:1, overflowY:"auto", padding:"10px"}}>
          {reportList.map(r => (
            <div key={r.id} onClick={() => setActiveMetaId(r.id)} className="project-item"
              style={{padding:"12px", borderRadius:10, cursor:"pointer", marginBottom:"8px", background:activeMetaId===r.id?C.card:"transparent", border:`1px solid ${activeMetaId===r.id?C.border:"transparent"}`, position:"relative"}}>
              <div style={{fontSize:12, fontWeight:600, color:activeMetaId===r.id?C.accent:C.text, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>{r.dest || "Untitled"}</div>
              <div style={{fontSize:10, color:C.muted}}>{r.client}</div>
              <button onClick={async (e)=>{
                  e.stopPropagation();
                  if(confirm("삭제할까요?")) {
                      await window._fb.deleteDoc(window._fb.doc(window._fb.db, "meta", r.id));
                      if(activeMetaId === r.id) setActiveMetaId(null);
                  }
              }} style={{position:"absolute", top:10, right:8, background:"none", border:"none", color:C.danger, fontSize:12, cursor:"pointer"}}>✕</button>
            </div>
          ))}
        </div>
      </div>

      <div className="main-content">
        {!activeMetaId ? (
          <div style={{textAlign:"center", color:C.muted, marginTop:100}}>리포트를 선택하거나 새로 만드세요.</div>
        ) : (
          <div style={{maxWidth:800, margin:"0 auto"}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:30}}>
              <h2 style={{fontSize:20, fontWeight:800}}>{meta.dest || "Untitled"}</h2>
              <button onClick={()=>setShowReport(true)} style={{padding:"8px 16px", background:"transparent", border:`1px solid ${C.accent}`, color:C.accent, borderRadius:20, fontSize:11, fontWeight:600}}>Preview Report</button>
            </div>

            <div style={{background:C.card, borderRadius:16, padding:20, border:`1px solid ${C.border}`, display:"grid", gridTemplateColumns:"repeat(2, 1fr)", gap:15, marginBottom:25}}>
              {[{k:"dest", l:"출장지"}, {k:"client", l:"고객사"}, {k:"period", l:"기간"}, {k:"reporter", l:"작성자"}].map(f => (
                <div key={f.k}>
                  <label style={{fontSize:9, fontWeight:700, color:C.muted, display:"block", marginBottom:5}}>{f.l}</label>
                  <input style={{width:"100%", background:C.input, border:`1px solid ${C.border}`, borderRadius:8, padding:"10px", color:C.text, fontSize:13}}
                    value={meta[f.k]||""} onChange={e=>updateMeta(f.k, e.target.value)}/>
                </div>
              ))}
            </div>

            <div style={{marginBottom:15, display:"flex", alignItems:"center", justifyContent:"space-between"}}>
              <div style={{fontSize:13, fontWeight:700}}>Daily Logs</div>
              <button onClick={async () => {
                  const { db, collection, addDoc } = window._fb;
                  await addDoc(collection(db, "days"), { date: new Date().toISOString().slice(0,10), place:"", vehicle:"", product:"", content:"", mediaFiles:[], createdAt: Date.now() });
              }} style={{background:C.input, border:`1px solid ${C.border}`, color:C.text, padding:"5px 12px", borderRadius:6, fontSize:11}}>+ Add Day</button>
            </div>

            {sortedDays.map((d, idx) => (
              <div key={d.id} style={{background:C.card, borderRadius:16, border:`1px solid ${C.border}`, marginBottom:20, overflow:"hidden"}}>
                <div style={{padding:"12px 20px", background:"rgba(255,255,255,0.02)", display:"flex", alignItems:"center", justifyContent:"space-between", borderBottom:`1px solid ${C.border}`}}>
                  <div style={{display:"flex", alignItems:"center", gap:10}}>
                    <span style={{fontSize:10, fontWeight:900, color:C.accent}}>DAY {idx+1}</span>
                    <input type="date" value={d.date||""} onChange={e=>updateDay(d.id, "date", e.target.value)} style={{background:"transparent", border:"none", color:C.text, fontSize:12, colorScheme:"dark"}}/>
                  </div>
                  <button onClick={async() => { if(confirm("삭제할까요?")) await window._fb.deleteDoc(window._fb.doc(window._fb.db,"days",d.id)); }} style={{background:"transparent", border:"none", color:C.muted, fontSize:11}}>Delete</button>
                </div>
                <div style={{padding:20}}>
                  <div style={{display:"grid", gridTemplateColumns:"repeat(3, 1fr)", gap:10, marginBottom:15}}>
                    {FIELDS.slice(0,3).map(f => (
                      <div key={f.key}>
                        <div style={{fontSize:9, color:C.muted, marginBottom:4}}>{f.label}</div>
                        <input style={{width:"100%", background:C.input, border:`1px solid ${C.border}`, borderRadius:8, padding:"8px", color:C.text, fontSize:12}} value={d[f.key]||""} onChange={e=>updateDay(d.id, f.key, e.target.value)}/>
                      </div>
                    ))}
                  </div>
                  <div style={{marginBottom:15}}>
                    <div style={{fontSize:9, color:C.muted, marginBottom:4}}>Description</div>
                    <textarea style={{width:"100%", background:C.input, border:`1px solid ${C.border}`, borderRadius:8, padding:"10px", color:C.text, fontSize:12, minHeight:80}} value={d.content||""} onChange={e=>updateDay(d.id, "content", e.target.value)}/>
                  </div>
                  <div style={{display:"flex", flexWrap:"wrap", gap:8}}>
                    {d.mediaFiles?.map((m, i) => (
                      <div key={i} className="media-container" style={{position:"relative", width:80, height:80, borderRadius:10, overflow:"hidden", border:`1px solid ${C.border}`}}>
                        {m.type?.startsWith("video") ? <video src={m.url} style={{width:"100%", height:"100%", objectFit:"cover"}}/> : <img src={m.url} style={{width:"100%", height:"100%", objectFit:"cover"}}/>}
                        <button onClick={()=>deleteMedia(d.id, i)} style={{position:"absolute", top:4, right:4, background:"rgba(0,0,0,0.7)", border:"none", color:"#fff", width:18, height:18, borderRadius:9, fontSize:10}}>✕</button>
                      </div>
                    ))}
                    <UploadButton uploading={uploading[d.id]} onFiles={f => addMedia(d.id, f)}/>
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
      {showReport && <div style={{position:"fixed", inset:0, background:"#fff", zIndex:5000, overflowY:"auto"}}>
          <button onClick={()=>setShowReport(false)} style={{position:"fixed", top:15, right:15, background:"#111", color:"#fff", border:"none", width:36, height:36, borderRadius:20, zIndex:5001, cursor:"pointer"}}>✕</button>
          <PureReportView meta={meta} days={sortedDays} isFullPage={false} />
      </div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
